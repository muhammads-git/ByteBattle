<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Register — ByteBattle</title>
  <link rel="stylesheet" href="static/style.css">
  <link rel="stylesheet" href="static/auth.css">
</head>
<body>
  <div class="auth-shell">
    <div class="glyph-field" aria-hidden="true" id="glyph-field"></div>

    <div class="auth-card">
      <div class="auth-brand">
        <a href="1-home.html" class="brand-link">Byte<span>Battle</span></a>
      </div>

      <div class="type-headline" id="type-headline"></div>

      <div class="auth-panel">
        <div class="auth-heading-wrap">
          <h1>Join the roster</h1>
          <svg class="chalk-underline" viewBox="0 0 84 10" aria-hidden="true">
            <path d="M2 6 C 20 2, 40 9, 62 4 S 80 3, 82 5" stroke="var(--marker)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="auth-subtext">Only enrolled roll numbers can register.</p>


        <form method="post" action="#">
          <div class="field field-rollno">
            <label for="roll_no">Roll number</label>
            <input type="text" id="roll_no" name="roll_no" placeholder="FA21-BCS-045" autocomplete="off" required>
          </div>

          <div class="field">
            <label for="username">Display name</label>
            <input type="text" id="username" name="username" placeholder="What shows on the leaderboard" autocomplete="off" required minlength="3" maxlength="20">
            <div class="field-hint">Letters, numbers and underscores only.</div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="new-password" required minlength="8">
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">Create account</button>
        </form>
      </div>

      <p class="auth-switch">Already registered? <a href="7-login.html">Log in</a></p>
    </div>
  </div>

  <script>
    // one orchestrated entrance moment: type the tagline, then blink
    (function () {
      const el = document.getElementById('type-headline');
      const text = 'guess the output. beat your class.';
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) { el.textContent = text; return; }
      let i = 0;
      function type() {
        el.textContent = text.slice(0, i);
        i++;
        if (i <= text.length) setTimeout(type, 35);
      }
      type();
    })();

    // ambient glyph field — a handful of faint drifting code symbols, not confetti
    (function () {
      const field = document.getElementById('glyph-field');
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const symbols = ['{ }', '< >', ';', '==', 'def', '[ ]', '#', 'True'];
      const count = window.innerWidth < 640 ? 6 : 10;
      for (let n = 0; n < count; n++) {
        const s = document.createElement('span');
        s.className = 'glyph';
        s.textContent = symbols[n % symbols.length];
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.fontSize = (0.8 + Math.random() * 0.8) + 'rem';
        s.style.animationDuration = (14 + Math.random() * 10) + 's';
        s.style.animationDirection = n % 2 ? 'reverse' : 'normal';
        field.appendChild(s);
      }
    })();
  </script>
</body>
</html>
