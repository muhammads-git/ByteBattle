<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard — ByteBattle</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div class="shell">
  <header class="topbar"><a href="1-home.html" class="brand">Byte<span>Battle</span></a></header>
  <main class="main center-col">
    <div class="eyebrow-plain">Room XB73H3</div>
    <h1>Leaderboard</h1>
    <div class="podium">
      <div class="podium-slot second"><div class="avatar-ring">H</div><div class="p-name">Hammad</div><div class="p-score">142 pts</div><div class="stand">2</div></div>
      <div class="podium-slot first"><div class="avatar-ring">U</div><div class="p-name">Usman</div><div class="p-score">168 pts</div><div class="stand">1</div></div>
      <div class="podium-slot third"><div class="avatar-ring">D</div><div class="p-name">Dani</div><div class="p-score">97 pts</div><div class="stand">3</div></div>
    </div>
    <div class="panel" style="width:100%;max-width:480px;text-align:left;">
      <ul class="rank-list">
        <li class="rank-row you"><span class="rank-num">4</span><span class="rank-name">Hina (you)</span><span class="rank-score">64 pts</span></li>
      </ul>
    </div>
    <div class="result-actions"><a href="1-home.html" class="btn btn-primary">Start a new room</a></div>
  </main>
</div>
</body>
</html>
