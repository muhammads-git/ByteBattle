<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}ByteBattle{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  
  <!-- Global Authentication Interceptor Script for Silent Refresh -->
  <script>
    async function secureFetch(url, options = {}) {
        let response = await fetch(url, options);

        // Catch the 401 Authentication Error when the Access Cookie expires
        if (response.status === 401) {
            console.warn("Access token expired. Detouring to refresh endpoint silently...");

            // Silently ping your /auth/refresh endpoint.
            // Aligned perfectly with your app.include_router(auths_router, prefix='/auth')
            const refreshResponse = await fetch('/auth/refresh', { method: 'POST' });

            if (refreshResponse.ok) {
                console.log("Tokens refreshed successfully! Retrying original request...");
                // Retry the exact original request with the fresh new access cookie
                response = await fetch(url, options);
            } else {
                console.error("Refresh token invalid. Routing to login interface.");
                // Route to your actual exposed GET login page endpoint
                window.location.href = '/auth/login-page'; 
            }
        }
        return response;
    }
  </script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a href="/home" class="brand">Byte<span>Battle</span></a>
      {% block header_right %}{% endblock %}
    </header>
    <main class="main {% block main_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}

  <!-- GLOBAL FORM & NAVIGATION CLICK INTERCEPTORS -->
  <script>
    // 1. GLOBAL LINK INTERCEPTOR: Protects standard anchor navigation links (e.g., Leaderboard)
    document.addEventListener('click', async function(e) {
        // Find if the clicked element (or its parent) is a standard anchor link
        const anchor = e.target.closest('a');
        
        // If it's not a link, or it's pointing to a different domain, let the browser handle it natively
        if (!anchor || anchor.hostname !== window.location.hostname) return;
        
        // Skip intercepting explicit authentication routes to avoid circular loops
        if (anchor.pathname.includes('/login') || anchor.pathname.includes('/register') || anchor.pathname.includes('/logout')) {
            return;
        }

        // 🛑 Stop the browser from performing a native, unprotected page shift
        e.preventDefault();
        
        const targetUrl = anchor.href;
        console.log(`Intercepting navigation to: ${targetUrl} via secureFetch shield.`);

        try {
            // Send a background GET check request. If it hits a 401, secureFetch will handle rotation automatically!
            const response = await secureFetch(targetUrl, { method: 'GET' });

            if (response.ok) {
                // If tokens are active or successfully rotated, update page focus safely
                window.location.href = targetUrl;
            }
        } catch (err) {
            console.error("Global navigation shield failure:", err);
            // Fallback recovery if something breaks completely
            window.location.href = '/auth/login-page';
        }
    });

    // 2. GLOBAL FORM INTERCEPTOR: Protects data submissions across views
    document.addEventListener('submit', async function(e) {
        const form = e.target;
        
        // Ensure credential submissions hit standard processing behaviors bypassing interceptors
        if (form.action.includes('/login') || form.action.includes('/register')) {
            return; 
        }

        e.preventDefault();
        const formData = new FormData(form);
        
        if (e.submitter && e.submitter.name) {
            formData.append(e.submitter.name, e.submitter.value);
        }

        try {
            const response = await secureFetch(form.action || window.location.href, {
                method: form.method || 'POST',
                body: formData
            });

            if (response.ok) {
                if (response.redirected) {
                    window.location.href = response.url;
                } else {
                    window.location.reload();
                }
            }
        } catch (err) {
            console.error("Form handling network error:", err);
        }
    });
  </script>

</body>
</html>
