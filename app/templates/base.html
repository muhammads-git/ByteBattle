<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}ByteBattle{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  
  <!-- Global Authentication Interceptor Script for Silent Refresh -->
  <script>
    async function secureFetch(url, options = {}) {
        let response = await fetch(url, options);

        // Catch the 401 Authentication Error when the Access Cookie expires
        if (response.status === 401) {
            console.warn("Access token expired. Detouring to refresh endpoint silently...");

            // Silently ping your /auth/refresh endpoint.
            // calling refresh to generate new tokens (silently)
            const refreshResponse = await fetch('/auth/refresh', { method: 'POST' });

            if (refreshResponse.ok) {
                console.log("Tokens refreshed successfully! Retrying the original request...");
                // Retry the exact original request with the fresh new access cookie
                response = await fetch(url, options);
            } else {
                console.error("Refresh token is invalid or expired. Routing to login page.");
                window.location.href = '/auth/login';
            }
        }
        return response;
    }
  </script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a href="/" class="brand">Byte<span>Battle</span></a>
      {% block header_right %}{% endblock %}
    </header>
    <main class="main {% block main_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}

  <!-- GLOBAL FORM INTERCEPTOR -->
  <script>
    async function secureFetch(url, options = {}) {
        let response = await fetch(url, options);

        if (response.status === 401) {
            console.warn("Access token expired. Detouring to refresh endpoint silently...");

            // 1. Aligned perfectly with your app.include_router(auths_router, prefix='/auth')
            const refreshResponse = await fetch('/auth/refresh', { method: 'POST' });

            if (refreshResponse.ok) {
                console.log("Tokens refreshed successfully! Retrying original request...");
                response = await fetch(url, options);
            } else {
                console.error("Refresh token invalid. Routing to login interface.");
                // 2. Route to your actual exposed GET login page endpoint
                window.location.href = '/auth/login-page'; 
            }
        }
        return response;
    }

    document.addEventListener('submit', async function(e) {
        const form = e.target;
        
        // Ensure credential submissions hit standard processing behaviors bypassing interceptors
        if (form.action.includes('/login') || form.action.includes('/register')) {
            return; 
        }

        e.preventDefault();
        const formData = new FormData(form);
        
        if (e.submitter && e.submitter.name) {
            formData.append(e.submitter.name, e.submitter.value);
        }

        try {
            const response = await secureFetch(form.action || window.location.href, {
                method: form.method || 'POST',
                body: formData
            });

            if (response.ok) {
                if (response.redirected) {
                    window.location.href = response.url;
                } else {
                    window.location.reload();
                }
            }
        } catch (err) {
            console.error("Form handling network error:", err);
        }
    });
  </script>

</body>
</html>
